<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stress Predictor 💖</title>

    <!-- Cute Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px 35px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4d6d;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff4d6d;
            box-shadow: 0 0 8px rgba(255,77,109,0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff4d6d, #ff758c);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255,77,109,0.4);
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #ff4d6d;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .emoji {
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>💖 Stress Predictor</h1>
    <p>Tell me your routine, I'll tell your stress ✨</p>

    <form action="/predict" method="post">

        <input type="number" step="any" name="study" placeholder="📚 Study Hours" required>
        <input type="number" step="any" name="extra" placeholder="🎨 Extracurricular Hours" required>
        <input type="number" step="any" name="sleep" placeholder="😴 Sleep Hours" required>
        <input type="number" step="any" name="social" placeholder="💬 Social Hours" required>
        <input type="number" step="any" name="physical" placeholder="🏃 Physical Activity" required>
        <input type="number" step="any" name="gpa" placeholder="🎯 GPA" required>

        <button type="submit">✨ Predict Stress</button>
    </form>

    {% if result %}
        <div class="result">
            💌 Your Stress Level: {{ result }}
        </div>
    {% endif %}

</div>

</body>
</html>
